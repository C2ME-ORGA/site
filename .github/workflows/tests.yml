name: CI / CD

on:
  push:
    branches:
      - master
      - production
  pull_request:
    branches:
      - master

permissions:
  contents: read

# Un seul déploiement à la fois sur le serveur OVH partagé.
concurrency:
  group: c2me-server-deployment
  cancel-in-progress: false

jobs:
  tests:
    name: Tests et contrôles
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate deployment shell scripts
        run: bash -n scripts/deploy-production-root.sh scripts/deploy-production-app.sh scripts/deploy-production.sh deploy.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: mbstring, bcmath, curl, dom, fileinfo, intl, pdo_mysql, pdo_sqlite, sqlite3, zip

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Prepare test environment
        run: |
          cp .env.example .env
          mkdir -p database
          touch database/database.sqlite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run quality checks and tests
        run: composer ci:check
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          CACHE_STORE: file
          SESSION_DRIVER: file
          QUEUE_CONNECTION: sync

  deploy:
    name: Déploiement ${{ github.ref == 'refs/heads/master' && 'préproduction' || 'production' }}
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/production')
    timeout-minutes: 25
    environment:
      name: ${{ github.ref == 'refs/heads/master' && 'preproduction' || 'production' }}

    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install --yes sshpass

      - name: Deploy over SSH
        env:
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_TARGET: ${{ github.ref == 'refs/heads/master' && 'preproduction' || 'production' }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS" || { echo "Secret DEPLOY_PASSWORD manquant"; exit 1; }
          test -n "$DEPLOY_HOST" || { echo "Secret DEPLOY_HOST manquant"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "Secret DEPLOY_USER manquant"; exit 1; }
          test "$DEPLOY_USER" = "deploy" || { echo "DEPLOY_USER doit être deploy"; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "Secret DEPLOY_KNOWN_HOSTS manquant"; exit 1; }

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          sshpass -e ssh \
            -p "$DEPLOY_PORT" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o BatchMode=no \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n /usr/local/sbin/c2me-deploy $DEPLOY_TARGET"
