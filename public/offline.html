<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>C2ME — Hors ligne</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0e8577">
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: #f8fafc;
            color: #0d2b33;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        main {
            max-width: 32rem;
            text-align: center;
        }
        img { width: 96px; height: 96px; }
        h1 { margin: 1rem 0 0.5rem; font-size: 1.5rem; }
        p { margin: 0 0 1.5rem; line-height: 1.6; color: #475569; }
        a {
            display: inline-block;
            padding: 0.75rem 1.25rem;
            border-radius: 0.5rem;
            background: #0e8577;
            color: #fff;
            font-weight: 600;
            text-decoration: none;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #081c21; color: #f1f5f9; }
            p { color: #94a3b8; }
        }
    </style>
</head>
<body>
    <main>
        <img src="/images/logo-mark.png" alt="C2ME">
        <h1>Vous êtes hors ligne</h1>
        <p>
            Cette page n'est pas encore disponible sans connexion.
            Le mode terrain reste accessible pour les fiches déjà synchronisées.
        </p>
        <a href="/terrain">Ouvrir le mode terrain</a>
    </main>
</body>
</html>
